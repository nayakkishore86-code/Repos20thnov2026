trigger:
  branches:
    include:
      - main

stages:
  - stage: init
    displayName: init_stage
    jobs:
      - job: init_job
        displayName: init_job
        steps:

                

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environment/parent_module'
              backendServiceArm: 'Nayakserviceconnection'
              backendAzureRmStorageAccountName: 'storageb18common'
              backendAzureRmContainerName: 'testcontainer'
              backendAzureRmKey: 'terraform.tfstate'

  - stage: validate
    displayName: validate_stage
    jobs:
      - job: validate_job
        displayName: validate_job
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/envirnment/parent_module'
            backendServiceArm: 'Nayakserviceconnection'
            backendAzureRmStorageAccountName: 'storageb18common'
            backendAzureRmContainerName: 'testcontainer'
            backendAzureRmKey: 'terraform.tfstate'


        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/envirnment/parent_module'

  - stage: plan    
    displayName: plan_stage     
    jobs:
      - job: plan_job
        displayName: plan_job
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/envirnment/parent_module'
            backendServiceArm: 'Nayakserviceconnection'
            backendAzureRmStorageAccountName: 'storageb18common'
            backendAzureRmContainerName: 'testcontainer'
            backendAzureRmKey: 'terraform.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/envirnment/parent_module'
            environmentServiceNameAzureRM: 'Nayakserviceconnection'
  - stage: apply
    displayName: apply_stage
    jobs:
      - job: apply_job
        displayName: apply_job
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/envirnment/parent_module'
            backendServiceArm: 'Nayakserviceconnection'
            backendAzureRmStorageAccountName: 'storageb18common'
            backendAzureRmContainerName: 'testcontainer'
            backendAzureRmKey: 'terraform.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/envirnment/parent_module'
            commandOptions: '-- auto approve'
            environmentServiceNameAzureRM: 'Nayakserviceconnection'

          
                 
                    